AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  penny-expense-processor

  Lambda function for processing expenses in Penny expense tracking system

Globals:
  Function:
    Timeout: 300
    MemorySize: 1024

Parameters:
  ProcessingQueueArn:
    Type: String
    Description: ARN of the SQS Queue from webhook stack
  
  TelegramBotToken:
    Type: String
    Description: Token del bot de Telegram
    NoEcho: true
  
  GoogleServiceAccountSecret:
    Type: String
    Default: penny-expense-google-service-account
    Description: Name of the Secrets Manager secret containing Google Service Account credentials
  
  GoogleSheetId:
    Type: String
    Description: ID of the Google Sheet to write expenses to
  
  GeminiApiKey:
    Type: String
    Description: API Key for Google Gemini 2.0 Flash
    NoEcho: true

  DashboardUserId:
    Type: String
    Description: >
      Fixed "User ID" (email) stamped on every expense row this bot writes to
      the "Expenses" tab — must match the email used to log into
      penny-expenses-ui-stack, since the dashboard filters by userId.

Resources:
  PennyExpenseProcessorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: penny-expense-processor
      PackageType: Image
      Architectures:
        - x86_64
      Timeout: 300
      MemorySize: 1024
      Environment:
        Variables:
          TELEGRAM_BOT_TOKEN: !Ref TelegramBotToken
          GOOGLE_SERVICE_ACCOUNT_SECRET: !Ref GoogleServiceAccountSecret
          GOOGLE_SHEET_ID: !Ref GoogleSheetId
          GEMINI_API_KEY: !Ref GeminiApiKey
          DASHBOARD_USER_ID: !Ref DashboardUserId
      Events:
        SQSEvent:
          Type: SQS
          Properties:
            Queue: !Ref ProcessingQueueArn
            BatchSize: 1
            Enabled: true
      Policies:
        - CloudWatchLogsFullAccess
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${GoogleServiceAccountSecret}*'
        - Statement:
            - Effect: Allow
              Action:
                - s3:PutObject
                - s3:GetObject
                - s3:DeleteObject
              Resource: !Sub '${ImagesBucket.Arn}/*'
    Metadata:
      Dockerfile: Dockerfile
      DockerContext: ./expense_processor
      DockerTag: python3.12-v1

  ImagesBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'penny-expense-images-${AWS::AccountId}'
      LifecycleConfiguration:
        Rules:
          - Id: DeleteAfter7Days
            Status: Enabled
            ExpirationInDays: 7

Outputs:
  PennyExpenseProcessorFunction:
    Description: "Penny Expense Processor Lambda Function ARN"
    Value: !GetAtt PennyExpenseProcessorFunction.Arn
  
  PennyExpenseProcessorFunctionIamRole:
    Description: "Implicit IAM Role created for Penny Expense Processor function"
    Value: !GetAtt PennyExpenseProcessorFunctionRole.Arn
  
  ImagesBucketName:
    Description: "S3 Bucket for temporary image storage"
    Value: !Ref ImagesBucket
